services:
  zap:
    image: ghcr.io/zaproxy/zaproxy:stable
    container_name: zap_scanner
    ports:
      - "8080:8080"
    command: zap.sh -daemon -host 0.0.0.0 -port 8080 -config api.key=${ZAP_API_KEY:?ZAP_API_KEY must be set in .env} -config api.addrs.addr.name=.* -config api.addrs.addr.regex=true
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:8080/json/core/view/version?apikey=${ZAP_API_KEY:?ZAP_API_KEY must be set in .env}"]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 45s
    networks:
      - threat-net

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: threat_hunt_backend
    environment:
      # Secrets sourced from environment / .env (never hardcoded in committed compose files)
      - TH_ADMIN_PASSWORD=${TH_ADMIN_PASSWORD:-ChangeMe_Admin_Password123!}
      # SECURITY WARNING: Setting to true permits scanning RFC1918 / localhost / internal IP ranges (SSRF risk).
      # Shipped as false by default. Explicit opt-in via WEBSCAN_ALLOW_PRIVATE_TARGETS=true in .env for isolated lab use only.
      - WEBSCAN_ALLOW_PRIVATE_TARGETS=${WEBSCAN_ALLOW_PRIVATE_TARGETS:-false}
      - ZAP_ENABLED=true
      - ZAP_URL=http://zap:8080
      - ZAP_API_KEY=${ZAP_API_KEY:?ZAP_API_KEY must be set in .env}
      - SQLITE_JOURNAL_MODE=DELETE
      - EVENTLET_NO_GREENDNS=yes
      - HOST=0.0.0.0
      - ALLOWED_ORIGINS=http://localhost

    ports:
      - "5001:5000"
    volumes:
      - ./backend/src:/app/src
      - ./backend/threat_hunting.db:/app/threat_hunting.db
      - ./backend/data:/app/data
    depends_on:
      zap:
        condition: service_healthy
    networks:
      - threat-net
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:5000/api/health', timeout=3)"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 30s

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: threat_hunt_frontend
    environment:
      - REACT_APP_API_BASE_URL=http://localhost
      - WDS_SOCKET_PORT=0
    volumes:
      - ./frontend/src:/app/src
      - ./frontend/public:/app/public
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - threat-net
    restart: always

  nginx:
    image: nginx:alpine
    container_name: threat_hunt_proxy
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      backend:
        condition: service_healthy
      frontend:
        condition: service_started
    networks:
      - threat-net
    restart: always
    healthcheck:
      test: ["CMD", "sh", "-c", "wget -q -O- http://127.0.0.1/ > /dev/null 2>&1"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 10s

networks:
  threat-net:
    driver: bridge