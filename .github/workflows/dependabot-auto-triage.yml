name: "Dependabot Auto-Triage"

on:
  pull_request_target:
    branches: [ "main" ]

permissions:
  pull-requests: write
  contents: write

jobs:
  triage:
    runs-on: ubuntu-latest
    if: github.actor == 'dependabot[bot]'
    steps:
      - name: Fetch Dependabot Metadata
        id: metadata
        uses: dependabot/fetch-metadata@v3
        with:
          github-token: "${{ secrets.GITHUB_TOKEN }}"

      - name: Add Triage Labels
        uses: actions/github-script@v7
        with:
          script: |
            const updateType = '${{ steps.metadata.outputs.update-type }}';
            const labels = ['dependabot'];
            if (updateType.includes('patch')) {
              labels.push('patch');
            } else if (updateType.includes('minor')) {
              labels.push('minor');
            } else if (updateType.includes('major')) {
              labels.push('major', 'breaking-change');
            }
            github.rest.issues.addLabels({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              labels: labels
            });
