name: DecodeX Continuous Integration & Security Guardrails

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  security-guardrails:
    name: Security Regression & Secret Guardrails
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Check for CORS Wildcard Regressions
        run: |
          echo "Scanning for wildcard CORS configurations..."
          if grep -rnE 'cors_allowed_origins.*[\*]' backend/src/ ; then
            echo "::error::CORS wildcard regression detected in backend/src/"
            exit 1
          fi
          echo "[OK] No CORS wildcards detected."

      - name: Check for Hardcoded Unexpanded Secrets in docker-compose.yaml
        run: |
          echo "Scanning docker-compose.yaml for unexpanded secrets..."
          if grep -E '^\s*-\s*TH_ADMIN_PASSWORD=[^$]' docker-compose.yaml ; then
            echo "::error::Hardcoded unexpanded TH_ADMIN_PASSWORD found in docker-compose.yaml! Must use \${TH_ADMIN_PASSWORD:-...}"
            exit 1
          fi
          echo "[OK] docker-compose.yaml adheres to variable expansion."

      - name: Check for Leaked Historical Secret Strings
        run: |
          echo "Scanning for leaked legacy secret strings..."
          # Exclude git, ci workflows, docs, and dependency trees from self-matching
          if grep -rnF 'ufmqbdsum4iqindh6jaququfso' --exclude-dir=.git --exclude-dir=.github --exclude-dir=node_modules --exclude-dir=.venv --exclude-dir=build --exclude="*.md" . ; then
            echo "::error::Legacy leaked ZAP API key reappeared in tracked code/config!"
            exit 1
          fi
          echo "[OK] Zero leaked secret strings detected."

  backend-test:
    name: Backend Test Suite
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt
          pip install -e backend/

      - name: Run Backend Unit & Integration Tests
        run: |
          python -m unittest discover -s backend/tests -p 'test_*.py' -v

  frontend-test-and-build:
    name: Frontend Tests & Production Bundle
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install Frontend Dependencies
        run: |
          cd frontend
          npm ci

      - name: Run Frontend Test Suite
        run: |
          cd frontend
          CI=true npm test -- --watchAll=false

      - name: Compile Production Build
        run: |
          cd frontend
          npm run build
