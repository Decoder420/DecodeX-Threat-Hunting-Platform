{% extends "base.html" %}
{% block content %}
<div class="grid" style="max-width: 520px; margin: 80px auto;">
    <section class="panel">
        <h1 style="margin-top:0;">SOC Console Login</h1>
        <p class="muted">Default credentials for this prototype: <span class="mono">admin / admin123</span></p>
        <form method="post" class="grid">
            <div>
                <label>Username</label>
                <input type="text" name="username" required>
            </div>
            <div>
                <label>Password</label>
                <input type="password" name="password" required>
            </div>
            <button type="submit">Login</button>
        </form>
    </section>
</div>
{% endblock %}
