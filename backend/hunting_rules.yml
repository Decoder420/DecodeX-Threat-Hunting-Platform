rules:

# 🚨 1. Suspicious PowerShell with Encoding + Network
- id: advanced_powershell_attack
  severity: high
  description: PowerShell execution with encoded command and external IP
  technique_id: T1059.001
  tactic: Execution
  conditions:
    - type: event_field_contains
      field: process
      value: powershell
    - type: event_field_contains
      field: commandline
      value: encoded
    - type: ioc_ip_match

# 🚨 2. Multiple Failed Logins (Brute Force)
- id: brute_force_attempt
  severity: high
  description: Multiple failed login attempts detected
  technique_id: T1110
  tactic: Credential Access
  conditions:
    - type: event_field_contains
      field: commandline
      value: failed login

# 🚨 3. Suspicious Admin Login from External IP
- id: suspicious_admin_login
  severity: high
  description: Admin login from non-private IP
  technique_id: T1078
  tactic: Initial Access
  conditions:
    - type: event_field_contains
      field: user
      value: admin
    - type: ioc_ip_match

# 🚨 4. Living-off-the-Land Binary Abuse
- id: lolbin_abuse
  severity: medium
  description: Suspicious usage of LOLBins like cmd, powershell, wmic
  technique_id: T1218
  tactic: Defense Evasion
  conditions:
    - type: event_field_contains
      field: process
      value: cmd
    - type: event_field_contains
      field: commandline
      value: /c

# 🚨 5. Suspicious Network Beaconing
- id: beaconing_activity
  severity: medium
  description: Repeated outbound connections to IOC IP
  technique_id: T1071
  tactic: Command and Control
  conditions:
    - type: ioc_ip_match

# 🚨 6. Suspicious Hash Execution (Malware)
- id: malware_hash_detected
  severity: critical
  description: Execution of known malicious file hash
  technique_id: T1204
  tactic: Execution
  conditions:
    - type: ioc_hash_match

# 🚨 7. Lateral Movement Detection
- id: lateral_movement_smb
  severity: high
  description: Possible lateral movement using SMB
  technique_id: T1021
  tactic: Lateral Movement
  conditions:
    - type: event_field_contains
      field: commandline
      value: \\

# 🚨 8. Privilege Escalation Attempt
- id: privilege_escalation
  severity: high
  description: Suspicious privilege escalation attempt
  technique_id: T1068
  tactic: Privilege Escalation
  conditions:
    - type: event_field_contains
      field: commandline
      value: runas

# 🚨 9. Data Exfiltration Indicator
- id: data_exfiltration
  severity: critical
  description: Possible data exfiltration activity
  technique_id: T1041
  tactic: Exfiltration
  conditions:
    - type: event_field_contains
      field: commandline
      value: ftp

# 🚨 10. Suspicious Scheduled Task Creation
- id: persistence_task
  severity: high
  description: Suspicious scheduled task creation
  technique_id: T1053
  tactic: Persistence
  conditions:
    - type: event_field_contains
      field: commandline
      value: schtasks

# 🚨 11. Encoded PowerShell (-enc)
- id: encoded_powershell
  severity: high
  description: Possible encoded PowerShell execution
  technique_id: T1059.001
  technique_name: "Command and Scripting Interpreter: PowerShell"
  tactic: Execution
  conditions:
    - type: event_field_contains
      field: process
      value: powershell
    - type: event_field_contains
      field: commandline
      value: "-enc"

# 🚨 12. Hidden PowerShell Window
- id: hidden_powershell
  severity: medium
  description: Hidden PowerShell window execution
  technique_id: T1059.001
  technique_name: "Command and Scripting Interpreter: PowerShell"
  tactic: Execution
  conditions:
    - type: event_field_contains
      field: process
      value: powershell
    - type: event_field_contains
      field: commandline
      value: "-w hidden"