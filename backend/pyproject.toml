[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "decodex-th"
version = "2.0.0"
description = "DecodeX Enterprise Threat Hunting, SIEM & Web Application Security Platform"
readme = "README.md"
requires-python = ">=3.10"
authors = [
    { name = "DecodeX Security Engineering Team" }
]
dependencies = [
    "Flask>=2.3,<4.0",
    "Flask-Cors>=3.0,<4.0",
    "Flask-SocketIO>=5.6,<6.0",
    "Flask-Sock>=0.7,<1.0",
    "PyYAML>=6.0,<7.0",
    "requests>=2.31,<3.0",
    "rich>=13.7,<14.0",
    "reportlab>=3.6,<4.0",
    "yara-python>=4.2.0,<5.0",
    "SQLAlchemy>=2.0,<3.0",
    "python-dotenv>=1.0,<2.0",
    "gunicorn>=21.2.0",
    "eventlet>=0.33.3",
    "psycopg2-binary>=2.9.9",
]

[tool.setuptools.packages.find]
where = ["src"]
